services:
  db:
    image: mysql:8.0
    container_name: c4gt-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: c4gt_root_pass
      MYSQL_DATABASE: c4gt_db
      MYSQL_USER: c4gt_user
      MYSQL_PASSWORD: c4gt_local_pass
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pc4gt_root_pass"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: c4gt-website
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      FLASK_APP: main.py
      FLASK_ENV: development
    command: flask run --host=0.0.0.0 --port=5000
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/login"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
